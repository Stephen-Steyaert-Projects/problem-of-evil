apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: problem-of-evil
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # Only gradpace (and the future LLM service) should ever land on
      # steyaert-worker - everything else stays pinned to the manager.
      nodeSelector:
        kubernetes.io/hostname: steyaert-mgr
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          # CI overrides this with `kubectl set image deployment/web
          # web=ghcr.io/.../flask-app:sha-<short>` - :latest here is only
          # the manual-apply default.
          image: ghcr.io/stephen-steyaert-projects/problem-of-evil/flask-app:latest
          env:
            - name: FLASK_ENV
              value: production
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: 8000
              httpHeaders:
                - name: Host
                  value: problem-of-evil.steyaert.xyz
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
              httpHeaders:
                - name: Host
                  value: problem-of-evil.steyaert.xyz
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
