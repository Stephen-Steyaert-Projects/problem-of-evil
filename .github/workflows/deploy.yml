# Example: Automatic deployment workflow
# Rename to deploy.yml to enable automatic deployment

name: Deploy to Production

on:
  workflow_run:
    workflows: ["Build and Push to GHCR"]
    types:
      - completed

jobs:
  deploy:
    runs-on: steyaert-projects
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # Only the k8s manifests + Makefile are needed on the runner; the app
      # itself runs from the image pulled by `kubectl set image`.
      - name: Checkout k8s manifests and Makefile
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: |
            k8s
            Makefile
          sparse-checkout-cone-mode: false

      - name: Deploy to k3s
        run: |
          TAG=sha-$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          kubectl apply -f k8s/
          make k8s-deploy TAG=$TAG
